<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Manager</title><link rel="stylesheet" href="/style.css"></head>
<body><aside class="sidebar"><div class="brand"><span>🌿</span> CLASS<br><strong>MANAGER</strong></div><nav>
<button data-page="dashboard">🏠 <span>Tổng quan</span></button>
<button data-page="students">🎓 <span>Học sinh</span></button>
<button data-page="scores">⭐ <span>Điểm thi đua</span></button>
<button data-page="violations">⚠️ <span>Vi phạm</span></button>
<button data-page="teams">👥 <span>Các tổ</span></button>
<button id="rulesNav" data-page="rules">⚙️ <span>Quy tắc điểm</span></button>
<button id="usersNav" data-page="users">🔐 <span>Tài khoản</span></button>
</nav><div class="side-user"><div class="avatar">👤</div><div><b id="who">...</b><small id="role">...</small></div></div><form method="post" action="/logout"><button class="logout">🚪 Đăng xuất</button></form></aside>
<main><header><div><h1 id="title">Tổng quan</h1><p id="subtitle">Theo dõi tình hình thi đua của lớp</p></div><div class="actions"><a class="btn" href="/export/excel">📊 Excel</a><a class="btn" href="/export/word">📄 Word</a></div></header><div id="alert"></div><section id="content"><div class="loading">Đang tải dữ liệu...</div></section></main>
<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);let me=null;
const roleName={ADMIN:"Quản trị viên",CLASS_LEADER:"Lớp trưởng",CLASS_VICE:"Lớp phó",TEAM_LEADER:"Tổ trưởng"};
async function api(url,opt={}){const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(r.status===401){location.href="/login";throw Error("Phiên đăng nhập hết hạn")}if(!r.ok)throw Error(d.error||"Có lỗi xảy ra");return d}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function formData(e){return Object.fromEntries(new FormData(e).entries())}
function toast(msg,type="ok"){$("#alert").innerHTML=`<div class="toast ${type}">${esc(msg)}</div>`;setTimeout(()=>$("#alert").innerHTML="",3000)}
async function boot(){try{const d=await api("/api/me");me=d.user;$("#who").textContent=me.full_name;$("#role").textContent=roleName[me.role];if(me.role!=="ADMIN"&&me.role!=="CLASS_LEADER")$("#rulesNav").style.display="none";if(me.role!=="ADMIN")$("#usersNav").style.display="none";$$("[data-page]").forEach(b=>b.onclick=()=>navigate(b.dataset.page));await navigate("dashboard")}catch(e){$("#content").innerHTML=`<div class="error-box"><b>Không tải được dữ liệu</b><p>${esc(e.message)}</p><p>Hãy mở <code>/api/health</code> để kiểm tra server.</p></div>`}}
async function navigate(page){$$("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));$("#title").textContent={dashboard:"Tổng quan",students:"Học sinh",scores:"Điểm thi đua",violations:"Vi phạm",teams:"Các tổ",rules:"Quy tắc điểm",users:"Tài khoản"}[page];$("#content").innerHTML=`<div class="loading">Đang tải...</div>`;try{await ({dashboard,students,scores,violations,teams,rules,users})[page]()}catch(e){$("#content").innerHTML=`<div class="error-box"><b>Không tải được trang</b><p>${esc(e.message)}</p></div>`}}
async function dashboard(){const d=(await api("/api/dashboard"));$("#subtitle").textContent=`Tháng ${d.month.month}/${d.month.year} · Cập nhật tự động`;$("#content").innerHTML=`
<div class="stat-grid">
<div class="stat"><div class="icon green">🎓</div><div><b>${d.stats.students}</b><span>Học sinh</span></div></div>
<div class="stat"><div class="icon blue">👥</div><div><b>${d.teams.length}</b><span>Tổ</span></div></div>
<div class="stat"><div class="icon yellow">⭐</div><div><b>${d.stats.total}</b><span>Tổng điểm</span></div></div>
<div class="stat"><div class="icon red">⚠️</div><div><b>${d.stats.violations}</b><span>Lượt ghi nhận</span></div></div>
</div>
<div class="two-col"><div class="panel"><div class="panel-head"><h2>🏆 Thi đua các tổ</h2><span>Điểm trung bình</span></div><div class="team-list">${d.teams.map((t,i)=>`<div class="team-row"><div class="rank">${["🥇","🥈","🥉","4"][i]||i+1}</div><div class="team-info"><b>${esc(t.name)}</b><small>${t.count} học sinh</small></div><div class="team-score"><b>${t.avg}</b><small>${t.total} tổng</small></div></div>`).join("")}</div></div>
<div class="panel"><div class="panel-head"><h2>⚠️ Vi phạm gần đây</h2><button class="text-btn" onclick="navigate('violations')">Xem tất cả →</button></div>${d.violations.length?d.violations.map(v=>`<div class="violation-row"><div class="v-icon">!</div><div><b>${esc(v.full_name)}</b><p>${esc(v.description||"Vi phạm")}</p></div><strong>${v.points}</strong></div>`).join(""):`<div class="empty">🎉 Chưa có vi phạm trong tháng.</div>`}</div></div>
<div class="panel"><div class="panel-head"><h2>📋 Xếp loại học sinh</h2><span>${d.students.length} học sinh</span></div><div class="table-wrap"><table><thead><tr><th>#</th><th>Học sinh</th><th>Tổ</th><th>Cộng</th><th>Trừ</th><th>Tổng</th><th>Xếp loại</th></tr></thead><tbody>${d.students.map((s,i)=>`<tr><td>${i+1}</td><td><b>${esc(s.full_name)}</b><small>${esc(s.student_code)}</small></td><td>${esc(s.team_name||"-")}</td><td class="plus">+${s.plus}</td><td class="minus">-${s.minus}</td><td><b>${s.total}</b></td><td><span class="badge ${s.classification==="Tốt"?"good":s.classification==="Khá"?"fair":""}">${s.classification}</span></td></tr>`).join("")}</tbody></table></div></div>`}
async function students(){const [a,b]=await Promise.all([api("/api/students"),api("/api/teams")]),ss=a.students,ts=b.teams;$("#content").innerHTML=`
${["ADMIN","CLASS_LEADER"].includes(me.role)?`<div class="panel"><div class="panel-head"><h2>➕ Thêm học sinh</h2></div><form class="form" onsubmit="addStudent(event)"><input name="student_code" placeholder="Mã học sinh" required><input name="full_name" placeholder="Họ và tên" required><select name="gender"><option>Nam</option><option>Nữ</option></select><select name="team_id">${ts.map(t=>`<option value="${t.id}">${t.name}</option>`).join("")}</select><button class="btn primary">Thêm học sinh</button></form></div>`:""}
<div class="panel"><div class="panel-head"><h2>🎓 Danh sách học sinh</h2><span>${ss.length} học sinh</span></div><div class="table-wrap"><table><thead><tr><th>Mã</th><th>Họ tên</th><th>Giới tính</th><th>Tổ</th><th></th></tr></thead><tbody>${ss.map(s=>`<tr><td>${esc(s.student_code)}</td><td><b>${esc(s.full_name)}</b></td><td>${esc(s.gender||"-")}</td><td>${esc(s.team_name||"-")}</td><td>${["ADMIN","CLASS_LEADER"].includes(me.role)?`<button class="danger-btn" onclick="removeStudent(${s.id})">Xóa</button>`:""}</td></tr>`).join("")}</tbody></table></div></div>`}
async function scores(){const [a,b]=await Promise.all([api("/api/students"),api("/api/rules")]);const ss=a.students,rr=b.rules;$("#content").innerHTML=`
<div class="panel"><div class="panel-head"><h2>⭐ Ghi nhận điểm</h2><span>Điểm sẽ tự cộng vào tháng hiện tại</span></div><form class="form" onsubmit="addScore(event)"><select name="student_id" required>${ss.map(s=>`<option value="${s.id}">${esc(s.full_name)} — ${esc(s.team_name||"")}</option>`).join("")}</select><select name="rule_id" required>${rr.map(r=>`<option value="${r.id}">${r.type==="PLUS"?"➕":"➖"} ${esc(r.name)} (${r.type==="PLUS"?"+":"-"}${r.points})</option>`).join("")}</select><input name="description" placeholder="Nội dung chi tiết (không bắt buộc)"><button class="btn primary">💾 Lưu điểm</button></form></div>
<div class="panel"><div class="panel-head"><h2>📌 Quy tắc điểm</h2></div><div class="rule-grid">${rr.map(r=>`<div class="rule ${r.type.toLowerCase()}"><b>${r.type==="PLUS"?"➕":"➖"} ${esc(r.name)}</b><strong>${r.type==="PLUS"?"+":"-"}${r.points}</strong><small>${esc(r.description||"")}</small></div>`).join("")}</div></div>`}
async function violations(){const d=await api("/api/dashboard");$("#content").innerHTML=`<div class="panel"><div class="panel-head"><h2>⚠️ Nhật ký vi phạm tháng ${d.month.month}/${d.month.year}</h2><span>${d.violations.length} bản ghi gần nhất</span></div>${d.violations.length?`<div class="table-wrap"><table><thead><tr><th>Học sinh</th><th>Điểm</th><th>Nội dung</th><th>Người ghi</th><th>Thời gian</th></tr></thead><tbody>${d.violations.map(v=>`<tr><td><b>${esc(v.full_name)}</b></td><td class="minus">${v.points}</td><td>${esc(v.description||"")}</td><td>${esc(v.recorder||"")}</td><td>${esc(v.created_at||"")}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">🎉 Chưa có vi phạm.</div>`}</div>`}
async function teams(){const d=await api("/api/dashboard");$("#content").innerHTML=`<div class="stat-grid">${d.teams.map(t=>`<div class="team-card"><div class="team-big">👥</div><h2>${esc(t.name)}</h2><p>${t.count} học sinh</p><b>${t.avg} điểm trung bình</b><small>${t.total} tổng điểm</small></div>`).join("")}</div>`}
async function rules(){const a=await api("/api/rules"),rr=a.rules;$("#content").innerHTML=`<div class="panel"><div class="panel-head"><h2>⚙️ Thiết lập điểm cộng / trừ</h2></div><form class="form" onsubmit="addRule(event)"><input name="name" placeholder="Tên quy tắc" required><select name="type"><option value="PLUS">Điểm cộng</option><option value="MINUS">Điểm trừ</option></select><input name="points" type="number" min="1" placeholder="Số điểm" required><input name="description" placeholder="Mô tả"><button class="btn primary">Thêm quy tắc</button></form></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Quy tắc</th><th>Loại</th><th>Điểm</th><th>Mô tả</th><th></th></tr></thead><tbody>${rr.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${r.type==="PLUS"?"Cộng":"Trừ"}</td><td class="${r.type==="PLUS"?"plus":"minus"}">${r.type==="PLUS"?"+":"-"}${r.points}</td><td>${esc(r.description||"")}</td><td><button class="danger-btn" onclick="deleteRule(${r.id})">Xóa</button></td></tr>`).join("")}</tbody></table></div></div>`}
async function users(){const [a,b]=await Promise.all([api("/api/users"),api("/api/teams")]),us=a.users,ts=b.teams;$("#content").innerHTML=`<div class="panel"><div class="panel-head"><h2>🔐 Tạo tài khoản</h2></div><form class="form" onsubmit="addUser(event)"><input name="username" placeholder="Tên đăng nhập" required><input name="password" type="password" placeholder="Mật khẩu" required><input name="full_name" placeholder="Họ tên" required><select name="role"><option value="CLASS_LEADER">Lớp trưởng</option><option value="CLASS_VICE">Lớp phó</option><option value="TEAM_LEADER">Tổ trưởng</option><option value="ADMIN">Admin</option></select><select name="team_id"><option value="">Không gán tổ</option>${ts.map(t=>`<option value="${t.id}">${t.name}</option>`).join("")}</select><button class="btn primary">Tạo tài khoản</button></form></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Tài khoản</th><th>Họ tên</th><th>Quyền</th><th>Tổ</th><th>Trạng thái</th><th></th></tr></thead><tbody>${us.map(u=>`<tr><td><b>${esc(u.username)}</b></td><td>${esc(u.full_name)}</td><td><span class="badge">${roleName[u.role]}</span></td><td>${u.team_id||"-"}</td><td>${u.active?"🟢 Hoạt động":"🔴 Đã khóa"}</td><td>${u.username!=="admin"?`<button class="danger-btn" onclick="toggleUser(${u.id})">${u.active?"Khóa":"Mở"}</button>`:""}</td></tr>`).join("")}</tbody></table></div></div>`}
async function addStudent(e){e.preventDefault();try{await api("/api/students",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(formData(e))});toast("Đã thêm học sinh");students()}catch(x){toast(x.message,"bad")}}
async function removeStudent(id){if(!confirm("Xóa học sinh này khỏi danh sách?"))return;try{await api("/api/students/"+id,{method:"DELETE"});toast("Đã xóa");students()}catch(x){toast(x.message,"bad")}}
async function addScore(e){e.preventDefault();try{await api("/api/scores",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(formData(e))});toast("Đã ghi nhận điểm");dashboard()}catch(x){toast(x.message,"bad")}}
async function addRule(e){e.preventDefault();try{await api("/api/rules",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(formData(e))});toast("Đã thêm quy tắc");rules()}catch(x){toast(x.message,"bad")}}
async function deleteRule(id){if(!confirm("Xóa quy tắc này?"))return;try{await api("/api/rules/"+id,{method:"DELETE"});rules()}catch(x){toast(x.message,"bad")}}
async function addUser(e){e.preventDefault();try{await api("/api/users",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(formData(e))});toast("Đã tạo tài khoản");users()}catch(x){toast(x.message,"bad")}}
async function toggleUser(id){try{await api("/api/users/"+id+"/toggle",{method:"PATCH"});users()}catch(x){toast(x.message,"bad")}}
boot();
</script></body></html>
