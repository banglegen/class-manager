<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý lớp</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">🌿 QUẢN LÝ LỚP</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-user">
      <b id="meName"></b><span id="meRole"></span>
      <button class="logout" type="button" onclick="changePassword()">🔑 Đổi mật khẩu</button>
      <form action="/logout" method="post"><button class="logout">Đăng xuất</button></form>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div><h1 id="title">Tổng quan</h1><p id="subtitle">Dữ liệu dùng chung online</p></div>
      <div class="top-actions">
        <select id="monthSel" onchange="changeMonth(this.value)" title="Chọn tháng"></select>
        <span id="exports"></span>
      </div>
    </header>
    <section class="content" id="content"><div class="loading">Đang tải...</div></section>
  </main>
</div>
<div id="modal" class="modal"></div>
<div id="toasts"></div>
<script src="/app.js"></script>
</body>
</html>
