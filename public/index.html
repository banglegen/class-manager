<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý lớp</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="app"><aside class="side"><div class="brand">🌿 QUẢN LÝ LỚP</div><div class="nav" id="nav"></div><div class="side-user"><b id="meName"></b><span id="meRole"></span><form action="/logout" method="post"><button class="logout">Đăng xuất</button></form></div></aside>
<main class="main"><header class="top"><div><h1 id="title">Tổng quan</h1><p id="subtitle">Dữ liệu dùng chung online</p></div><a id="xlsx" class="text-btn" href="/api/export.xlsx">⬇ Excel</a></header><section class="content" id="content"></section></main></div>
<script>
const $=s=>document.querySelector(s), roleName={ADMIN:"Admin",CLASS_LEADER:"Lớp trưởng",CLASS_VICE:"Lớp phó",TEAM_LEADER:"Tổ trưởng"};let me;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url,opt={}){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Có lỗi");return d}
function formData(e){return Object.fromEntries(new FormData(e).entries())}
function toast(m,bad=false){alert(m)}
const navItems=[["dashboard","🏠 Tổng quan"],["students","🎓 Học sinh"],["scores","⭐ Điểm thi đua"],["violations","⚠️ Vi phạm"],["teams","👥 Các tổ"],["conduct","📝 Hạnh kiểm"],["rules","⚙️ Quy tắc điểm"],["users","🔐 Tài khoản"]];
function buildNav(){let allowed=navItems.filter(([p])=>p!=="users"||me.role==="ADMIN").filter(([p])=>p!=="rules"||me.role==="ADMIN");$("#nav").innerHTML=allowed.map(([p,t])=>`<button data-page="${p}" onclick="navigate('${p}')">${t}</button>`).join("")}
async function navigate(page){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));$("#title").textContent={dashboard:"Tổng quan",students:"Học sinh",scores:"Điểm thi đua",violations:"Vi phạm",teams:"Các tổ",conduct:"Hạnh kiểm",rules:"Quy tắc điểm",users:"Tài khoản"}[page];$("#content").innerHTML='<div class="loading">Đang tải...</div>';try{await ({dashboard,students,scores,violations,teams,conduct,rules,users})[page]()}catch(e){$("#content").innerHTML=`<div class="error-box">${esc(e.message)}</div>`}}
async function dashboard(){const d=await api("/api/dashboard");$("#subtitle").textContent=`Tháng ${d.month.month}/${d.month.year} · Database online dùng chung`;$("#content").innerHTML=`
<div class="stat-grid"><div class="stat"><div class="icon">🎓</div><div><b>${d.stats.students}</b><span>Học sinh</span></div></div><div class="stat"><div class="icon">👥</div><div><b>${d.teams.length}</b><span>Tổ</span></div></div><div class="stat"><div class="icon">⭐</div><div><b>${d.stats.total}</b><span>Tổng điểm</span></div></div><div class="stat"><div class="icon">⚠️</div><div><b>${d.violations.length}</b><span>Vi phạm gần đây</span></div></div></div>
<div class="two-col"><div class="panel"><div class="panel-head"><h2>🏆 Thi đua các tổ</h2><span>Điểm trung bình</span></div>${d.teams.map((t,i)=>`<div class="team-row"><div class="rank">${i<3?["🥇","🥈","🥉"][i]:i+1}</div><div class="team-info"><b>${esc(t.name)}</b><small>${t.count} học sinh</small></div><div class="team-score"><b>${t.avg}</b><small>${t.total} tổng</small></div></div>`).join("")}</div>
<div class="panel"><div class="panel-head"><h2>⚠️ Vi phạm gần đây</h2><button class="text-btn" onclick="navigate('violations')">Xem →</button></div>${d.violations.slice(0,8).map(v=>`<div class="violation-row"><div class="v-icon">!</div><div><b>${esc(v.full_name)}</b><p>${esc(v.description||"Vi phạm")}</p></div><strong>${v.points}</strong></div>`).join("")||'<div class="empty">🎉 Chưa có vi phạm.</div>'}</div></div>
<div class="panel"><div class="panel-head"><h2>📋 Xếp loại & hạnh kiểm</h2><span>${d.students.length} học sinh</span></div><div class="table-wrap"><table><thead><tr><th>#</th><th>Học sinh</th><th>Tổ</th><th>Cộng</th><th>Trừ</th><th>Tổng</th><th>Xếp loại</th><th>Hạnh kiểm</th></tr></thead><tbody>${d.students.map((s,i)=>`<tr><td>${i+1}</td><td><b>${esc(s.full_name)}</b><small>${esc(s.student_code)}</small></td><td>${esc(s.team_name||"-")}</td><td class="plus">+${s.plus}</td><td class="minus">-${s.minus}</td><td><b>${s.total}</b></td><td><span class="badge good">${s.classification}</span></td><td><span class="badge">${s.conduct}</span></td></tr>`).join("")}</tbody></table></div></div>`}
async function students(){const [a,b]=await Promise.all([api("/api/students"),api("/api/teams")]);const ss=a.students,ts=b.teams;$("#content").innerHTML=`${["ADMIN","CLASS_LEADER"].includes(me.role)?`<div class="panel"><div class="panel-head"><h2>➕ Thêm học sinh</h2></div><form class="form" onsubmit="addStudent(event)"><input name="student_code" placeholder="Mã học sinh" required><input name="full_name" placeholder="Họ và tên" required><select name="gender"><option>Nam</option><option>Nữ</option></select><select name="team_id">${ts.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select><button class="btn primary">Thêm học sinh</button></form></div>`:""}<div class="panel"><div class="panel-head"><h2>🎓 Danh sách học sinh</h2><span>${ss.length} học sinh</span></div><div class="table-wrap"><table><thead><tr><th>Mã</th><th>Họ tên</th><th>Giới tính</th><th>Tổ</th><th></th></tr></thead><tbody>${ss.map(s=>`<tr><td>${esc(s.student_code)}</td><td><b>${esc(s.full_name)}</b></td><td>${esc(s.gender||"-")}</td><td>${esc(s.team_name||"-")}</td><td>${["ADMIN","CLASS_LEADER"].includes(me.role)?`<button class="danger-btn" onclick="removeStudent(${s.id})">Xóa</button>`:""}</td></tr>`).join("")}</tbody></table></div></div>`}
async function scores(){const [a,b]=await Promise.all([api("/api/students"),api("/api/rules")]);$("#content").innerHTML=`<div class="panel"><div class="panel-head"><h2>⭐ Ghi nhận điểm</h2><span>Điểm được lưu vào tháng hiện tại</span></div><form class="form" onsubmit="addScore(event)"><select name="student_id" required>${a.students.map(s=>`<option value="${s.id}">${esc(s.full_name)} — ${esc(s.team_name||"")}</option>`).join("")}</select><select name="rule_id" required>${b.rules.map(r=>`<option value="${r.id}">${r.type==="PLUS"?"➕":"➖"} ${esc(r.name)} (${r.type==="PLUS"?"+":"-"}${r.points})</option>`).join("")}</select><input name="description" placeholder="Nội dung chi tiết"><button class="btn primary">💾 Lưu điểm</button></form></div><div class="panel"><div class="panel-head"><h2>📌 Quy tắc điểm</h2></div><div class="rule-grid">${b.rules.map(r=>`<div class="rule ${r.type.toLowerCase()}"><b>${r.type==="PLUS"?"➕":"➖"} ${esc(r.name)}</b><strong>${r.type==="PLUS"?"+":"-"}${r.points}</strong><small>${esc(r.description||"")}</small></div>`).join("")}</div></div>`}
async function violations(){const d=await api("/api/violations");$("#content").innerHTML=`<div class="panel"><div class="panel-head"><h2>⚠️ Nhật ký vi phạm tháng ${d.month.month}/${d.month.year}</h2></div><div class="table-wrap"><table><thead><tr><th>Học sinh</th><th>Điểm</th><th>Nội dung</th><th>Người ghi</th><th>Thời gian</th></tr></thead><tbody>${d.violations.map(v=>`<tr><td><b>${esc(v.full_name)}</b></td><td class="minus">${v.points}</td><td>${esc(v.description||"")}</td><td>${esc(v.recorder||"")}</td><td>${new Date(v.created_at).toLocaleString("vi-VN")}</td></tr>`).join("")||'<tr><td colspan="5" class="empty">Chưa có vi phạm.</td></tr>'}</tbody></table></div></div>`}
async function teams(){const d=await api("/api/dashboard");$("#content").innerHTML=`<div class="stat-grid">${d.teams.map(t=>`<div class="team-card"><div class="team-big">👥</div><h2>${esc(t.name)}</h2><p>${t.count} học sinh</p><b>${t.avg} điểm trung bình</b><small>${t.total} tổng điểm</small></div>`).join("")}</div>`}
async function conduct(){const d=await api("/api/dashboard");if(!["ADMIN","CLASS_LEADER","CLASS_VICE"].includes(me.role)){return $("#content").innerHTML='<div class="panel"><div class="empty">Bạn chỉ có quyền xem hạnh kiểm.</div></div>'}$("#content").innerHTML=`<div class="panel"><div class="panel-head"><h2>📝 Xếp hạnh kiểm tháng ${d.month.month}/${d.month.year}</h2></div><form class="form" onsubmit="saveConduct(event)"><select name="student_id">${d.students.map(s=>`<option value="${s.id}">${esc(s.full_name)}</option>`).join("")}</select><select name="rating"><option>Tốt</option><option>Khá</option><option>Trung bình</option><option>Yếu</option></select><input name="note" placeholder="Nhận xét / nội dung phạm lỗi"><button class="btn primary">Lưu hạnh kiểm</button></form></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Học sinh</th><th>Xếp loại</th><th>Hạnh kiểm</th><th>Ghi chú</th></tr></thead><tbody>${d.students.map(s=>`<tr><td><b>${esc(s.full_name)}</b></td><td>${s.classification}</td><td><span class="badge">${s.conduct}</span></td><td>${esc(s.conduct_note)}</td></tr>`).join("")}</tbody></table></div></div>`}
async function rules(){const a=await api("/api/rules");$("#content").innerHTML=`<div class="panel"><div class="panel-head"><h2>⚙️ Thiết lập điểm cộng / trừ</h2></div><form class="form" onsubmit="addRule(event)"><input name="name" placeholder="Tên quy tắc" required><select name="type"><option value="PLUS">Điểm cộng</option><option value="MINUS">Điểm trừ</option></select><input name="points" type="number" min="1" placeholder="Số điểm" required><input name="description" placeholder="Mô tả"><button class="btn primary">Thêm</button></form></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Quy tắc</th><th>Loại</th><th>Điểm</th><th>Mô tả</th><th></th></tr></thead><tbody>${a.rules.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${r.type==="PLUS"?"Cộng":"Trừ"}</td><td class="${r.type==="PLUS"?"plus":"minus"}">${r.type==="PLUS"?"+":"-"}${r.points}</td><td>${esc(r.description||"")}</td><td><button class="danger-btn" onclick="deleteRule(${r.id})">Xóa</button></td></tr>`).join("")}</tbody></table></div></div>`}
async function users(){const [a,b]=await Promise.all([api("/api/users"),api("/api/teams")]);$("#content").innerHTML=`<div class="panel"><div class="panel-head"><h2>🔐 Tạo tài khoản</h2></div><form class="form" onsubmit="addUser(event)"><input name="username" placeholder="Tên đăng nhập" required><input name="password" type="password" minlength="6" placeholder="Mật khẩu ≥ 6 ký tự" required><input name="full_name" placeholder="Họ tên" required><select name="role"><option value="CLASS_LEADER">Lớp trưởng</option><option value="CLASS_VICE">Lớp phó</option><option value="TEAM_LEADER">Tổ trưởng</option><option value="ADMIN">Admin</option></select><select name="team_id"><option value="">Không gán tổ</option>${b.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select><button class="btn primary">Tạo tài khoản</button></form></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Tài khoản</th><th>Họ tên</th><th>Quyền</th><th>Tổ</th><th>Trạng thái</th><th></th></tr></thead><tbody>${a.users.map(u=>`<tr><td><b>${esc(u.username)}</b></td><td>${esc(u.full_name)}</td><td><span class="badge">${roleName[u.role]}</span></td><td>${u.team_id||"-"}</td><td>${u.active?"🟢 Hoạt động":"🔴 Đã khóa"}</td><td>${u.username!=="admin"?`<button class="danger-btn" onclick="toggleUser(${u.id})">${u.active?"Khóa":"Mở"}</button>`:""}</td></tr>`).join("")}</tbody></table></div></div>`}
async function addStudent(e){e.preventDefault();try{await api("/api/students",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(formData(e))});toast("Đã thêm học sinh");students()}catch(x){toast(x.message)}}
async function removeStudent(id){if(!confirm("Ẩn học sinh này khỏi danh sách?"))return;try{await api("/api/students/"+id,{method:"DELETE"});students()}catch(x){toast(x.message)}}
async function addScore(e){e.preventDefault();try{await api("/api/scores",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(formData(e))});toast("Đã ghi nhận điểm");dashboard()}catch(x){toast(x.message)}}
async function saveConduct(e){e.preventDefault();try{await api("/api/conduct",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(formData(e))});toast("Đã lưu hạnh kiểm");conduct()}catch(x){toast(x.message)}}
async function addRule(e){e.preventDefault();try{await api("/api/rules",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(formData(e))});toast("Đã thêm quy tắc");rules()}catch(x){toast(x.message)}}
async function deleteRule(id){if(!confirm("Xóa quy tắc?"))return;try{await api("/api/rules/"+id,{method:"DELETE"});rules()}catch(x){toast(x.message)}}
async function addUser(e){e.preventDefault();try{await api("/api/users",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(formData(e))});toast("Đã tạo tài khoản");users()}catch(x){toast(x.message)}}
async function toggleUser(id){try{await api("/api/users/"+id+"/toggle",{method:"PATCH"});users()}catch(x){toast(x.message)}}
async function boot(){try{const d=await api("/api/me");me=d.user;$("#meName").textContent=me.full_name;$("#meRole").textContent=roleName[me.role];buildNav();navigate("dashboard")}catch(e){location="/login"}}
</script></body></html>
